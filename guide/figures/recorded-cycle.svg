<title>The recorded cycle in six steps: both dates triaged under the first playbooks; what arrived since, a memo, a correction and a gap report; the curator&#x27;s proposal; the gate and the approval; both dates triaged again under the second playbooks; a poisoned memo and a hostile proposal, and what stopped each. It replays with no API key.</title>
