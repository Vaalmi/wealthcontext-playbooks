<text class="tt14" x="254" y="104" text-anchor="middle">What arrived since</text>
<text class="ts" x="254" y="124" text-anchor="middle">a memo, a correction,</text>
<text class="ts" x="254" y="141" text-anchor="middle">a gap report</text>
