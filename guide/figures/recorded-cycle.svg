<text class="tt14" x="90" y="104" text-anchor="middle">Triage, version 1</text>
<text class="ts" x="90" y="124" text-anchor="middle">a failed feed and a</text>
<text class="ts" x="90" y="141" text-anchor="middle">missing cross-check</text>
