<text class="ts" x="910" y="141" text-anchor="middle">hostile proposal, stopped</text>
<text class="tt" x="500" y="208" text-anchor="middle">Replays with no API key</text>
<text class="ts" x="500" y="224" text-anchor="middle">WealthContext&#x27;s reads are real, every check runs again, and only the models&#x27; replies come from the recording of the live cycle of 2026-11-24.</text>
