<rect class="box muted" x="210" y="30" width="170" height="62" rx="7"/>
<rect class="box ok" x="20" y="150" width="170" height="250" rx="7"/>
<rect class="box" x="210" y="150" width="170" height="70" rx="7"/>
<rect class="box" x="400" y="150" width="170" height="70" rx="7"/>
<rect class="box accent" x="590" y="150" width="170" height="70" rx="7"/>
<rect class="box ok" x="780" y="150" width="170" height="70" rx="7"/>
<rect class="box warn" x="780" y="300" width="170" height="52" rx="7"/>
<rect class="box" x="780" y="368" width="170" height="52" rx="7"/>
<rect class="box" x="590" y="325" width="170" height="70" rx="7"/>
<rect class="box accent" x="400" y="325" width="170" height="70" rx="7"/>
<rect class="box accent" x="210" y="325" width="170" height="70" rx="7"/>
<rect class="box deny" x="400" y="424" width="170" height="40" rx="7"/>
<rect class="box muted" x="20" y="488" width="960" height="40" rx="7"/>
<text class="tt" x="295" y="58" text-anchor="middle">WealthContext</text>
<text class="ts" x="295" y="74" text-anchor="middle">unchanged, read-only</text>
<text class="ts" x="396" y="58" text-anchor="start">Read through three of its published read routes, signed in as operations.</text>
<text class="ts" x="396" y="74" text-anchor="start">Nothing in WealthContext changes, and its database is never opened.</text>
<text class="tt okt" x="105" y="197" text-anchor="middle">Playbooks</text>
<text class="ts" x="105" y="213" text-anchor="middle">the firm&#x27;s steps for</text>
<text class="ts" x="105" y="228" text-anchor="middle">each kind of warning</text>
<text class="ts" x="105" y="243" text-anchor="middle"></text>
<text class="ts" x="105" y="258" text-anchor="middle">one file per version,</text>
<text class="ts" x="105" y="273" text-anchor="middle">never written over</text>
<text class="ts" x="105" y="288" text-anchor="middle"></text>
<text class="ts" x="105" y="303" text-anchor="middle">a new version on</text>
<text class="ts" x="105" y="318" text-anchor="middle">each approval</text>
<text class="ts" x="105" y="333" text-anchor="middle"></text>
<text class="ts" x="105" y="348" text-anchor="middle">every note names</text>
<text class="ts" x="105" y="363" text-anchor="middle">the version it used</text>
<text class="tt" x="295" y="174.5" text-anchor="middle">Exceptions</text>
<text class="ts" x="295" y="190.5" text-anchor="middle">built by fixed rules</text>
<text class="ts" x="295" y="205.5" text-anchor="middle">from the warnings</text>
<text class="tt" x="485" y="174.5" text-anchor="middle">Triage agent</text>
<text class="ts" x="485" y="190.5" text-anchor="middle">picks a step from a list,</text>
<text class="ts" x="485" y="205.5" text-anchor="middle">or says none applies</text>
<text class="tt accentt" x="675" y="174.5" text-anchor="middle">Backend check</text>
<text class="ts" x="675" y="190.5" text-anchor="middle">by fixed fields; one retry,</text>
<text class="ts" x="675" y="205.5" text-anchor="middle">then a note with no action</text>
<text class="tt okt" x="865" y="174.5" text-anchor="middle">Triage note</text>
<text class="ts" x="865" y="190.5" text-anchor="middle">who to tell, by when,</text>
<text class="ts" x="865" y="205.5" text-anchor="middle">hold or not; a receipt</text>
<rect class="lbg" x="258.4" y="242" width="83.2" height="16" rx="3"/>
<text class="lbl okt" x="300" y="254" text-anchor="middle">steps in use</text>
<rect class="lbg" x="265.6" y="114" width="58.8" height="16" rx="3"/>
<text class="lbl" x="295" y="126" text-anchor="middle">warnings</text>
<text class="tt warnt" x="865" y="323" text-anchor="middle">Gap reports</text>
<text class="ts" x="865" y="339" text-anchor="middle">what the playbooks miss</text>
<text class="tt" x="865" y="391" text-anchor="middle">Firm sources</text>
<text class="ts" x="865" y="407" text-anchor="middle">memos, corrections</text>
<text class="tt" x="675" y="349.5" text-anchor="middle">Curator</text>
<text class="ts" x="675" y="365.5" text-anchor="middle">proposes a change, and</text>
<text class="ts" x="675" y="380.5" text-anchor="middle">cites what it rests on</text>
<text class="tt accentt" x="485" y="349.5" text-anchor="middle">Gate</text>
<text class="ts" x="485" y="365.5" text-anchor="middle">six checks, each result</text>
<text class="ts" x="485" y="380.5" text-anchor="middle">recorded</text>
<text class="tt accentt" x="295" y="349.5" text-anchor="middle">Playbook owner</text>
<text class="ts" x="295" y="365.5" text-anchor="middle">approves by hash,</text>
<text class="ts" x="295" y="380.5" text-anchor="middle">or refuses with a reason</text>
<rect class="lbg" x="805.1" y="252" width="119.8" height="16" rx="3"/>
<text class="lbl warnt" x="865" y="264" text-anchor="middle">filed by the agent</text>
<text class="tt denyt" x="485" y="441" text-anchor="middle">Refused</text>
<text class="ts" x="485" y="457" text-anchor="middle">playbooks unchanged</text>
<text class="lbl" x="580" y="449" text-anchor="start">when any check fails</text>
<text class="tt" x="500" y="512.5" text-anchor="middle">The ledger records every source, gap report, proposal, check result, approval and refusal, each line chained to the one before.</text>
</svg>
