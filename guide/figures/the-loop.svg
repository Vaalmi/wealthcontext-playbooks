<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 1028 568" width="1028" height="568" role="img" aria-label="The whole loop. WealthContext&#x27;s warnings become exceptions by fixed rules. The triage agent picks a playbook step for each or says none applies, the backend checks the pick, and a triage note with a receipt comes out. The agent files a gap report for what the playbooks miss. Gap reports and firm sources go to the curator, which proposes a change; the gate runs six checks; the playbook owner approves or refuses; an approved change is a new playbook version in use. A failed check leaves the playbooks unchanged. The ledger records every source, gap report, proposal, check result, approval and refusal; triage runs are kept in a log of their own.">
<title>The whole loop. WealthContext&#x27;s warnings become exceptions by fixed rules. The triage agent picks a playbook step for each or says none applies, the backend checks the pick, and a triage note with a receipt comes out. The agent files a gap report for what the playbooks miss. Gap reports and firm sources go to the curator, which proposes a change; the gate runs six checks; the playbook owner approves or refuses; an approved change is a new playbook version in use. A failed check leaves the playbooks unchanged. The ledger records every source, gap report, proposal, check result, approval and refusal; triage runs are kept in a log of their own.</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.panel{fill:#FBFCFB;stroke:#CDD3D6}.tt{font-size:13px;font-weight:600;fill:#18202B}.tt14{font-size:14px;font-weight:600;fill:#18202B}.ts{font-size:11.5px;fill:#566070}.lbl{font-size:11px;fill:#566070}.zl{font-size:10.5px;letter-spacing:.08em;font-weight:600;fill:#566070}.chipt{font-size:11.5px;font-weight:600}.stepn{font-size:19px;font-weight:600;fill:#18202B}.lbg{fill:#FBFCFB}.zone{fill:#F4F6F5;stroke:#CDD3D6;stroke-dasharray:5 4}.box{fill:#FFFFFF;stroke:#7B8592;stroke-width:1.1}.box.muted{fill:#E9ECEB;stroke:#CDD3D6}.box.ghost{fill:none;stroke:#7B8592;stroke-dasharray:6 4}.step{fill:#FFFFFF;stroke:#7B8592;stroke-width:2}.edge{fill:none;stroke:#46505E;stroke-width:1.4}.edge.dash{stroke-dasharray:5 4}.head{fill:#46505E}.person{fill:#7B8592}.accentt{fill:#2756A6}.box.accent,.step.accent{fill:#E2EAF7;stroke:#2756A6}.edge.accent{stroke:#2756A6}.head.accent{fill:#2756A6}.okt{fill:#1F7A4D}.box.ok,.step.ok{fill:#DFF1E7;stroke:#1F7A4D}.edge.ok{stroke:#1F7A4D}.head.ok{fill:#1F7A4D}.warnt{fill:#9C5B0E}.box.warn,.step.warn{fill:#FAEBD5;stroke:#9C5B0E}.edge.warn{stroke:#9C5B0E}.head.warn{fill:#9C5B0E}.denyt{fill:#B02A22}.box.deny,.step.deny{fill:#F8E1DF;stroke:#B02A22}.edge.deny{stroke:#B02A22}.head.deny{fill:#B02A22}</style>
<defs><marker id="head-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head base" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head ok" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head warn" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head deny" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="panel" x="-13.5" y="-13.5" width="1027" height="567" rx="10"/>
<rect class="zone" x="8" y="112" width="984" height="364" rx="12"/>
<text class="zl" x="22" y="132">WEALTHCONTEXT PLAYBOOKS</text>
<path class="edge" d="M 295 92 L 295 150" marker-end="url(#head-base)"/>
<path class="edge" d="M 380 185 L 400 185" marker-end="url(#head-base)"/>
<path class="edge" d="M 570 185 L 590 185" marker-end="url(#head-base)"/>
