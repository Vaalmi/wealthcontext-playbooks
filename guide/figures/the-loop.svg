<path class="edge" d="M 780 340 L 760 340" marker-end="url(#head-base)"/>
<path class="edge" d="M 780 382 L 760 382" marker-end="url(#head-base)"/>
<path class="edge" d="M 590 360 L 570 360" marker-end="url(#head-base)"/>
