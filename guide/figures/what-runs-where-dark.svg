<text class="tt" x="800" y="185" text-anchor="start">Playbook owner</text>
<text class="ts" x="800" y="202" text-anchor="start">approve, refuse, retire</text>
<text class="ts" x="850" y="236" text-anchor="middle">the playbooks command and a page</text>
<text class="tt" x="850" y="294.5" text-anchor="middle">Playbook folder</text>
<text class="ts" x="850" y="310.5" text-anchor="middle">one file per version,</text>
