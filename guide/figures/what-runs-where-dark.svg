<text class="tt" x="160" y="119" text-anchor="middle">Triage agent</text>
<text class="ts" x="160" y="135" text-anchor="middle">its own key and network</text>
<text class="tt" x="160" y="222" text-anchor="middle">Chat model</text>
<text class="ts" x="160" y="238" text-anchor="middle">a provider, or the recording</text>
