<text class="ts" x="160" y="341" text-anchor="middle">its own key and network</text>
<text class="tt accentt" x="500" y="192" text-anchor="middle">Backend</text>
<text class="ts" x="500" y="208" text-anchor="middle">owns every record and rule</text>
