<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 1028 498" width="1028" height="498" role="img" aria-label="What runs where. Three containers on one machine: a backend and two agents. The backend owns every record and rule and is the only caller of WealthContext, which it reads as operations through three read routes. The triage agent and the curator each have a key and a network of their own and reach the backend&#x27;s API only; each calls a chat model, which is a provider or the recording. The analyst and the playbook owner use the playbooks command and a page. The playbook folder holds one file per version and the ledger; the database and the triage log are in a volume that is never committed.">
<title>What runs where. Three containers on one machine: a backend and two agents. The backend owns every record and rule and is the only caller of WealthContext, which it reads as operations through three read routes. The triage agent and the curator each have a key and a network of their own and reach the backend&#x27;s API only; each calls a chat model, which is a provider or the recording. The analyst and the playbook owner use the playbooks command and a page. The playbook folder holds one file per version and the ledger; the database and the triage log are in a volume that is never committed.</title>
