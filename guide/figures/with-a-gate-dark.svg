<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 1028 448" width="1028" height="448" role="img" aria-label="Two loops. In a knowledge factory with no gate, an agent flags a gap, a curator agent rewrites the shared knowledge and agents read it: a change rests on nothing, nothing is tested first, no person approves and no record says why. With Playbooks, the triage agent files a gap report, the curator proposes a change that rests on firm sources or gap reports, a gate checks it, the playbook owner approves it, the new version goes into use and the ledger keeps each check&#x27;s result and each decision.">
<title>Two loops. In a knowledge factory with no gate, an agent flags a gap, a curator agent rewrites the shared knowledge and agents read it: a change rests on nothing, nothing is tested first, no person approves and no record says why. With Playbooks, the triage agent files a gap report, the curator proposes a change that rests on firm sources or gap reports, a gate checks it, the playbook owner approves it, the new version goes into use and the ledger keeps each check&#x27;s result and each decision.</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.panel{fill:#161C23;stroke:#323B47}.tt{font-size:13px;font-weight:600;fill:#E5E9EE}.tt14{font-size:14px;font-weight:600;fill:#E5E9EE}.ts{font-size:11.5px;fill:#9AA4B1}.lbl{font-size:11px;fill:#9AA4B1}.zl{font-size:10.5px;letter-spacing:.08em;font-weight:600;fill:#9AA4B1}.chipt{font-size:11.5px;font-weight:600}.stepn{font-size:19px;font-weight:600;fill:#E5E9EE}.lbg{fill:#161C23}.zone{fill:#192028;stroke:#323B47;stroke-dasharray:5 4}.box{fill:#1D242D;stroke:#6A7584;stroke-width:1.1}.box.muted{fill:#252D38;stroke:#323B47}.box.ghost{fill:none;stroke:#6A7584;stroke-dasharray:6 4}.step{fill:#1D242D;stroke:#6A7584;stroke-width:2}.edge{fill:none;stroke:#A9B2BF;stroke-width:1.4}.edge.dash{stroke-dasharray:5 4}.head{fill:#A9B2BF}.person{fill:#6A7584}.accentt{fill:#8EB2F2}.box.accent,.step.accent{fill:#1D2C47;stroke:#8EB2F2}.edge.accent{stroke:#8EB2F2}.head.accent{fill:#8EB2F2}.okt{fill:#6FCB9A}.box.ok,.step.ok{fill:#163325;stroke:#6FCB9A}.edge.ok{stroke:#6FCB9A}.head.ok{fill:#6FCB9A}.warnt{fill:#E8B062}.box.warn,.step.warn{fill:#382813;stroke:#E8B062}.edge.warn{stroke:#E8B062}.head.warn{fill:#E8B062}.denyt{fill:#F28B83}.box.deny,.step.deny{fill:#3B1C1A;stroke:#F28B83}.edge.deny{stroke:#F28B83}.head.deny{fill:#F28B83}</style>
<defs><marker id="head-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head base" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head ok" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head warn" d="M0 0 L10 5 L0 10 z"/></marker><marker id="head-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head deny" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="panel" x="-13.5" y="-13.5" width="1027" height="447" rx="10"/>
<rect class="zone" x="20" y="20" width="470" height="380" rx="12"/>
<text class="zl" x="34" y="40">A KNOWLEDGE FACTORY WITH NO GATE</text>
<rect class="zone" x="510" y="20" width="470" height="380" rx="12"/>
<text class="zl" x="524" y="40">WITH PLAYBOOKS</text>
