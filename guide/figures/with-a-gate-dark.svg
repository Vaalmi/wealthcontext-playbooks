<rect class="box ok" x="830" y="290" width="130" height="56" rx="7"/>
<text class="tt" x="255" y="87" text-anchor="middle">Agent at work</text>
<text class="ts" x="255" y="103" text-anchor="middle">uses the shared knowledge</text>
<text class="tt" x="135" y="215" text-anchor="middle">Curator agent</text>
<text class="ts" x="135" y="231" text-anchor="middle">rewrites the knowledge</text>
<text class="tt" x="375" y="215" text-anchor="middle">Shared knowledge</text>
<text class="ts" x="375" y="231" text-anchor="middle">changed in place</text>
<rect class="lbg" x="121.45" y="134" width="77.1" height="16" rx="3"/>
<text class="lbl" x="160" y="146" text-anchor="middle">flags a gap</text>
<rect class="lbg" x="320.6" y="134" width="58.8" height="16" rx="3"/>
<text class="lbl" x="350" y="146" text-anchor="middle">reads it</text>
<text class="ts chipt warnt" x="137.5" y="317" text-anchor="middle">a change rests on nothing</text>
<text class="ts chipt warnt" x="372.5" y="317" text-anchor="middle">nothing is tested first</text>
<text class="ts chipt warnt" x="137.5" y="363" text-anchor="middle">no person approves</text>
<text class="ts chipt warnt" x="372.5" y="363" text-anchor="middle">no record of why it changed</text>
<text class="tt" x="745" y="87" text-anchor="middle">Triage agent</text>
<text class="ts" x="745" y="103" text-anchor="middle">applies the playbooks</text>
<text class="tt" x="595" y="195" text-anchor="middle">Curator</text>
<text class="ts" x="595" y="211" text-anchor="middle">proposes only</text>
<text class="tt accentt" x="745" y="195" text-anchor="middle">Gate</text>
<text class="ts" x="745" y="211" text-anchor="middle">six checks</text>
<text class="tt accentt" x="895" y="195" text-anchor="middle">Playbook owner</text>
<text class="ts" x="895" y="211" text-anchor="middle">a named person</text>
<text class="tt" x="595" y="315" text-anchor="middle">Firm sources</text>
<text class="ts" x="595" y="331" text-anchor="middle">memos, corrections</text>
<text class="tt" x="745" y="315" text-anchor="middle">Ledger</text>
<text class="ts" x="745" y="331" text-anchor="middle">checks and decisions</text>
<text class="tt okt" x="895" y="315" text-anchor="middle">Playbooks</text>
<text class="ts" x="895" y="331" text-anchor="middle">one file a version</text>
<rect class="lbg" x="549.5" y="126" width="71" height="16" rx="3"/>
<text class="lbl" x="585" y="138" text-anchor="middle">gap report</text>
<rect class="lbg" x="640.6" y="144" width="58.8" height="16" rx="3"/>
<text class="lbl" x="670" y="156" text-anchor="middle">proposal</text>
<rect class="lbg" x="796.7" y="144" width="46.6" height="16" rx="3"/>
<text class="lbl" x="820" y="156" text-anchor="middle">passes</text>
<rect class="lbg" x="574.75" y="250" width="40.5" height="16" rx="3"/>
<text class="lbl" x="595" y="262" text-anchor="middle">cited</text>
<rect class="lbg" x="715.6" y="250" width="58.8" height="16" rx="3"/>
<text class="lbl" x="745" y="262" text-anchor="middle">recorded</text>
<rect class="lbg" x="865.6" y="250" width="58.8" height="16" rx="3"/>
<text class="lbl okt" x="895" y="262" text-anchor="middle">approves</text>
<rect class="lbg" x="860.3" y="74" width="95.4" height="16" rx="3"/>
<text class="lbl" x="908" y="86" text-anchor="middle">version in use</text>
<text class="ts" x="745" y="370" text-anchor="middle">A change rests on a firm source or a gap report,</text>
<text class="ts" x="745" y="386" text-anchor="middle">passes the checks, is approved, and is on record.</text>
</svg>
