name: Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: false
      - run: make setup
      - name: Install the browser's system packages
        run: uv run --frozen playwright install-deps chromium
      - run: make check
      - run: make cycle
      - name: Show the containers' logs on failure
        if: failure()
        run: docker ps --all && docker compose logs --no-color --tail=120 || true
